name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least Privilege Enforcement: beperk de GITHUB_TOKEN universeel tot uitsluitend leesrechten
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc -b)
        run: npm run build
      - name: Unit tests (all workspaces)
        timeout-minutes: 10
        run: npm run test:unit
      - name: Multi-peer smoke scenario (3 in-process PluginHosts, real mDNS/TLS)
        timeout-minutes: 10
        run: npm run test:smoke

  rust:
    name: Rust check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: apps/desktop-shell/src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-shell/src-tauri
      - name: cargo check
        run: cargo check
      - name: cargo test (serde wire-contract round-trips)
        run: cargo test
