name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least Privilege Enforcement: beperk de GITHUB_TOKEN universeel tot uitsluitend leesrechten
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Node 20 is EOL (April 2026) and the pinned libp2p v3 stack requires
        # Node >= 22, so 20 is no longer a supported runtime to test on. The
        # 22/24 pair covers the two active LTS lines; GitHub runners already
        # default to 24, so the desktop app must prove out on it.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc -b)
        run: npm run build
      - name: Unit tests (all workspaces)
        timeout-minutes: 10
        run: npm run test:unit
      - name: Multi-peer smoke scenario (3 in-process PluginHosts, real mDNS/TLS)
        timeout-minutes: 10
        run: npm run test:smoke

  rust:
    name: Rust check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: apps/desktop-shell/src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-shell/src-tauri
      # `cargo check` runs tauri-build, which validates `bundle.externalBin`
      # (`bin/p2p-hub-core`). That SEA sidecar is gitignored and must be built
      # before cargo can resolve it — otherwise the build script fails with
      # "resource path `bin/p2p-hub-core-<triple>` doesn't exist".
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        working-directory: .
        run: npm ci
      # build:sea bundles core-server with esbuild, which resolves the
      # @p2p-hub/core and @p2p-hub/sdk workspace packages through their
      # package.json `main` (dist/index.js). tsc -b must run first so those
      # dist outputs exist — otherwise esbuild fails with "Could not resolve
      # @p2p-hub/core" and the cargo step never runs.
      - name: Build workspace packages (tsc -b)
        working-directory: .
        run: npm run build
      - name: Build core-server SEA sidecar (Tauri externalBin)
        working-directory: .
        run: npm run build:sea -w @p2p-hub/core-server
      - name: cargo check
        run: cargo check
      - name: cargo test (serde wire-contract round-trips)
        run: cargo test
