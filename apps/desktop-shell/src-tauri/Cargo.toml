[package]
name = "p2p-hub-shell"
version = "0.1.0"
description = "P2P Hub desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
log = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
url = "2"
